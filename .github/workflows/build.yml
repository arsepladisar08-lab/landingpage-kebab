name: Build and type check

on:
  push:
    branches: [SOWAN]
  pull_request:
    branches: [SOWAN]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
